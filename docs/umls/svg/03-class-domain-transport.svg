ing" textLength="85.0269" x="1719.5" y="923.9966">picture could</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.3179" x="1719.5" y="939.1294">be split and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.2729" x="1719.5" y="954.2622">parsed as two</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.9116" x="1719.5" y="969.395">chat messages.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9902" x="1719.5" y="984.5278">Chat JSON stays</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.6021" x="1719.5" y="999.6606">small; pictures</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.4023" x="1719.5" y="1014.7935">and files use a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.4604" x="1719.5" y="1029.9263">binary body instead</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.3262" x="1719.5" y="1045.0591">of base64.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="185" id="ent0056"><path d="M175.5,627.5 L175.5,682.8984 A0,0 0 0 0 175.5,682.8984 L415.62,682.8984 L535.53,870.27 L423.62,682.8984 L630.0322,682.8984 A0,0 0 0 0 630.0322,682.8984 L630.0322,637.5 L620.0322,627.5 L175.5,627.5 A0,0 0 0 0 175.5,627.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M620.0322,627.5 L620.0322,637.5 L630.0322,637.5 L620.0322,627.5" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.5322" x="181.5" y="644.5669">Only room names are persisted (rooms.json). Users and messages</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="417.1934" x="181.5" y="659.6997">exist while the process runs; on restart the room list is reloaded</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.3696" x="181.5" y="674.8325">and every user re-joins by name.</text></g><!--reverse link Message to TextMessage--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="extension" data-source-line="138" id="lnk28"><path codeLine="138" d="M299.5861,1304.945 C291.9561,1357.755 284.27,1411 278.17,1453.2" fill="none" id="Message-backto-TextMessage" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="302.16,1287.13,293.6477,1304.087,305.5244,1305.803,302.16,1287.13" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link Message to PictureMessage--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="extension" data-source-line="139" id="lnk29"><path codeLine="139" d="M358.5899,1302.8658 C384.4499,1349.4258 409.46,1394.43 433.16,1437.08" fill="none" id="Message-backto-PictureMessage" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="349.85,1287.13,353.3446,1305.7791,363.8351,1299.9525,349.85,1287.13" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link Message to FileMessage--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="extension" data-source-line="140" id="lnk30"><path codeLine="140" d="M426.6838,1290.991 C432.5038,1293.861 422.2,1288.59 428,1291 C496.53,1319.5 691.11,1327.04 753,1368 C781.92,1387.14 804.82,1419.05 820.14,1445.3" fill="none" id="Message-backto-FileMessage" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="410.54,1283.03,424.0302,1296.3722,429.3375,1285.6097,410.54,1283.03" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link Message to SystemMessage--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" dat